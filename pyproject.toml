[project]
name = "ahreas-mcp"
version = "0.1.0"
description = "MCP server para o ERP Ahreas (Ahreas/Superlógica): catálogo de métodos lido do WSDL da própria instalação, consulta e operação via SOAP com a credencial da administradora."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "VanguardIA" }]
keywords = ["mcp", "ahreas", "superlogica", "condominios", "erp", "soap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastmcp>=2.11",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "defusedxml>=0.7",
]

[project.urls]
Homepage = "https://github.com/VanguardIA-Tech/ahreas-mcp"
Issues = "https://github.com/VanguardIA-Tech/ahreas-mcp/issues"

[project.scripts]
ahreas-mcp = "ahreas_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "respx>=0.22",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahreas_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
